<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spam or Ham?</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="app">

  <h1>Hello</h1>
  <div id="name"></div>

  <script type="module">
    import init, { greet, load_classifier } from "./public/pkg/spam_or_ham.js";
    init().then(async () => {
      let res = await fetch("/model.json");
      let model_as_text = await res.text();
      console.log("model", model_as_text)
      let text = load_classifier(model_as_text);
      document.getElementById("name").innerText = text;
    })
  </script>
</body>

</html>
