[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"
web-sys = {version = "0.3.106", features = ["console"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stop-words = {version = "0.10.1", features = ["nltk"]}
regex = "1.13.1"
