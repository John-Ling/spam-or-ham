[package]
name = "spam-or-ham"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
csv = "1.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wasm-bindgen = "0.2.129"
web-sys = {version = "0.3.106", features = ["console"] }
